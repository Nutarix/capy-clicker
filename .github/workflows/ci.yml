name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # playtest_mockup_shots_test.dart needs fonts and paths from another
      # machine; spec 001 moves it to tool/. Until then CI skips it by name.
      - name: flutter test
        run: flutter test $(find test -name '*_test.dart' ! -name 'playtest_mockup_shots_test.dart' | sort)
